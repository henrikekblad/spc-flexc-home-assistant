name: Release

# HACS installs the zip attached to the release (hacs.json: zip_release), so every install shows up
# as a download of that asset.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c 'import json; print(json.load(open("custom_components/spc_flexc/manifest.json"))["version"])')
          if [ "$tag" != "$version" ]; then echo "Tag $tag does not match manifest version $version"; exit 1; fi
      - name: Zip the integration
        run: |
          cd custom_components/spc_flexc
          zip -r "$GITHUB_WORKSPACE/spc_flexc.zip" . -x '*__pycache__*'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" spc_flexc.zip --clobber
